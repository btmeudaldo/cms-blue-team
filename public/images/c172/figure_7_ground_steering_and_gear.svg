<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="480" fill="url(#bg)"/>

  <!-- Title block -->
  <g transform="translate(20, 20)">
    <rect width="560" height="36" rx="8" fill="#0B2E59" />
    <text x="280" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="1">
      CESSNA 172 · SISTEMAS AEROMECÁNICOS DE CÉLULA (SECCIÓN 7)
    </text>
  </g>

  <!-- Panel 1: Dirección en Tierra (Ground Steering) -->
  <g transform="translate(20, 68)" filter="url(#shadow)">
    <rect width="270" height="240" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="270" height="30" rx="10" fill="#f1f5f9"/>
    <text x="135" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">
      DIRECCIÓN EN TIERRA (NOSE GEAR)
    </text>

    <!-- Diagram of wheel and angles -->
    <circle cx="135" cy="115" r="50" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Neutral Line -->
    <line x1="135" y1="65" x2="135" y2="165" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- 10 deg arc (Pedales) -->
    <path d="M 126 75 A 40 40 0 0 1 144 75" fill="none" stroke="#0284c7" stroke-width="3"/>
    <!-- 30 deg arc (Frenos) -->
    <path d="M 110 85 A 50 50 0 0 1 160 85" fill="none" stroke="#ea580c" stroke-width="3"/>

    <!-- Wheel representation -->
    <rect x="127" y="90" width="16" height="50" rx="4" fill="#334155"/>
    
    <!-- Labels -->
    <g font-family="system-ui, sans-serif" font-size="9" font-weight="bold">
      <rect x="15" y="175" width="240" height="22" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
      <text x="135" y="190" text-anchor="middle" fill="#0369a1">
        PEDALES: ±10° (Conexión elástica por Bungee)
      </text>

      <rect x="15" y="203" width="240" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="135" y="218" text-anchor="middle" fill="#c2410c">
        FRENO DIFERENCIAL: hasta ±30°
      </text>
    </g>
  </g>

  <!-- Panel 2: Tren de Aterrizaje y Frenos -->
  <g transform="translate(310, 68)" filter="url(#shadow)">
    <rect width="270" height="240" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="270" height="30" rx="10" fill="#f1f5f9"/>
    <text x="135" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">
      TREN Y AMORTIGUACIÓN
    </text>

    <!-- Schematic -->
    <g transform="translate(30, 45)">
      <!-- Main Strut -->
      <path d="M 15 15 L 75 80" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
      <circle cx="75" cy="80" r="18" fill="#475569"/>
      <text x="105" y="55" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#1e293b">Pata Principal:</text>
      <text x="105" y="70" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">Ballesta de acero tubular</text>
      <text x="105" y="82" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">Freno de disco hidráulico</text>

      <!-- Nose Strut -->
      <line x1="20" y1="120" x2="60" y2="120" stroke="#0284c7" stroke-width="6"/>
      <line x1="40" y1="105" x2="40" y2="150" stroke="#0284c7" stroke-width="4"/>
      <circle cx="40" cy="150" r="14" fill="#334155"/>
      <text x="105" y="125" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0369a1">Pata de Morro:</text>
      <text x="105" y="138" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">Amortiguador Oleoneumático</text>
      <text x="105" y="150" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b">(Cámara de aire y aceite)</text>
    </g>

    <g font-family="system-ui, sans-serif" font-size="9" font-weight="bold">
      <rect x="15" y="203" width="240" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="135" y="218" text-anchor="middle" fill="#334155">
        Radio Mínimo Giro: 27 ft 5.5 in (8.37 m)
      </text>
    </g>
  </g>

  <!-- Panel 3: Aviso Neumático de Pérdida (Stall Warning) -->
  <g transform="translate(20, 320)" filter="url(#shadow)">
    <rect width="560" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="560" height="30" rx="10" fill="#f1f5f9"/>
    <text x="280" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">
      AVISO NEUMÁTICO DE PÉRDIDA (STALL WARNING HORN)
    </text>

    <!-- Airfoil and suction vent diagram -->
    <g transform="translate(40, 45)">
      <!-- Leading edge profile -->
      <path d="M 10 50 C 10 20, 40 10, 110 15 C 70 30, 40 45, 110 55 C 30 55, 10 65, 10 50 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
      <!-- Vent opening in leading edge -->
      <circle cx="18" cy="42" r="3.5" fill="#ef4444"/>
      <!-- Low pressure arrows -->
      <path d="M 5 35 Q 15 38 18 42" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="25" y="38" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#b91c1c">Depresión</text>

      <!-- Connection line to horn -->
      <path d="M 18 42 C 20 65, 120 70, 160 50" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>
      <!-- Horn symbol -->
      <polygon points="160,45 180,35 180,65" fill="#eab308" stroke="#ca8a04"/>
      <text x="190" y="53" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#a16207">Bocina en cabina</text>
    </g>

    <!-- Text description -->
    <g transform="translate(260, 40)" font-family="system-ui, sans-serif" font-size="10">
      <text x="0" y="16" font-weight="bold" fill="#0f172a">Activación por Succión Aerodinámica:</text>
      <text x="0" y="32" fill="#334155">• Suena entre 5 y 10 nudos antes de la pérdida.</text>
      <text x="0" y="48" fill="#334155">• Funciona en todas las configuraciones y virajes.</text>
      <text x="0" y="64" font-weight="bold" fill="#15803d">✓ 100% INDEPENDIENTE DEL SISTEMA ELÉCTRICO</text>
      <text x="0" y="80" fill="#64748b">Comprobación prevuelo: aspiración suave con paño limpio.</text>
    </g>
  </g>
</svg>
